<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamTV - Live Streaming</title>
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e94560; }
        .logo { font-size: 28px; font-weight: bold; color: #e94560; }
        .header-right { display: flex; gap: 20px; align-items: center; }
        .live-indicator { display: flex; align-items: center; gap: 8px; color: #ff4444; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .live-dot { width: 10px; height: 10px; background: #ff4444; border-radius: 50%; box-shadow: 0 0 10px #ff4444; }
        .clock { font-size: 18px; color: #a0a0a0; }
        .container { display: flex; height: calc(100vh - 70px); }
        .channel-sidebar { width: 320px; background: #141414; border-right: 1px solid #333; overflow-y: auto; padding: 10px; }
        .sidebar-header { padding: 15px; font-size: 14px; color: #888; text-transform: uppercase; border-bottom: 1px solid #333; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .refresh-btn { background: #e94560; border: none; color: #fff; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .channel-item { display: flex; align-items: center; padding: 12px 15px; margin: 5px 0; border-radius: 8px; cursor: pointer; transition: all 0.3s; border: 1px solid transparent; }
        .channel-item:hover { background: #1f1f1f; border-color: #e94560; }
        .channel-item.active { background: linear-gradient(90deg, #e94560 0%, #1f1f1f 100%); border-color: #e94560; }
        .channel-number { width: 35px; color: #666; font-weight: bold; font-size: 13px; }
        .channel-item.active .channel-number { color: #fff; }
        .channel-logo { width: 50px; height: 35px; background: #2a2a2a; border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-right: 12px; overflow: hidden; }
        .channel-logo img { width: 100%; height: 100%; object-fit: contain; }
        .channel-info { flex: 1; min-width: 0; }
        .channel-name { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
        .channel-now { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-item.active .channel-now { color: #ffd700; }
        .channel-status { width: 8px; height: 8px; border-radius: 50%; margin-left: 8px; }
        .channel-status.online { background: #00d084; box-shadow: 0 0 8px #00d084; }
        .channel-status.offline { background: #ff4444; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .player-section { background: #000; position: relative; }
        .video-container { aspect-ratio: 16/9; max-height: 50vh; background: #000; position: relative; }
        .video-js { width: 100%; height: 100%; }
        .vjs-big-play-button { background: rgba(233, 69, 96, 0.8) !important; border-color: #e94560 !important; }
        .channel-badge { position: absolute; top: 20px; left: 20px; background: rgba(233, 69, 96, 0.9); padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; z-index: 10; }
        .now-playing-bar { background: linear-gradient(90deg, #1a1a2e 0%, #16213e 100%); padding: 20px 30px; border-bottom: 1px solid #333; }
        .now-playing-title { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .now-playing-meta { display: flex; gap: 20px; color: #888; font-size: 14px; flex-wrap: wrap; }
        .progress-bar { width: 100%; height: 4px; background: #333; margin-top: 15px; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #e94560 0%, #ff6b6b 100%); width: 0%; transition: width 1s linear; }
        .category-tabs { display: flex; gap: 10px; padding: 15px 25px; background: #141414; border-bottom: 1px solid #333; overflow-x: auto; }
        .tab { padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; border: 1px solid transparent; white-space: nowrap; }
        .tab:hover { background: #1f1f1f; }
        .tab.active { background: #e94560; color: #fff; }
        .epg-section { flex: 1; overflow: auto; background: #0f0f0f; }
        .epg-header { display: flex; background: #1a1a1a; border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 10; }
        .epg-channel-col { width: 220px; padding: 15px; font-weight: bold; border-right: 1px solid #333; background: #141414; }
        .epg-time-header { flex: 1; display: flex; }
        .time-slot { flex: 1; padding: 15px; text-align: center; border-right: 1px solid #333; font-size: 13px; color: #888; min-width: 150px; }
        .time-slot.current { background: rgba(233, 69, 96, 0.2); color: #e94560; font-weight: bold; }
        .epg-grid { display: flex; flex-direction: column; }
        .epg-row { display: flex; border-bottom: 1px solid #222; min-height: 80px; }
        .epg-row:hover { background: rgba(255,255,255,0.02); }
        .epg-channel-cell { width: 220px; padding: 15px; border-right: 1px solid #333; display: flex; align-items: center; gap: 12px; background: #141414; }
        .epg-channel-num { color: #666; font-size: 12px; font-weight: bold; }
        .epg-channel-name { font-weight: 600; font-size: 14px; }
        .epg-programs { flex: 1; display: flex; }
        .program-block { flex: 1; padding: 12px; border-right: 1px solid #222; cursor: pointer; transition: all 0.2s; min-width: 150px; }
        .program-block:hover { background: rgba(233, 69, 96, 0.1); }
        .program-block.current { background: linear-gradient(135deg, rgba(233, 69, 96, 0.2) 0%, rgba(233, 69, 96, 0.05) 100%); border-left: 3px solid #e94560; }
        .program-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .program-time { font-size: 11px; color: #666; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #333; border-top-color: #e94560; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e94560; }
        .error-msg { color: #ff4444; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">📺 StreamTV</div>
        <div class="header-right">
            <div class="live-indicator"><span class="live-dot"></span>LIVE</div>
            <div class="clock" id="clock">12:00 PM</div>
        </div>
    </div>

    <div class="container">
        <div class="channel-sidebar">
            <div class="sidebar-header">
                <span>Channels <span id="channelCount">(0)</span></span>
                <button class="refresh-btn" onclick="loadChannels()">↻ Load</button>
            </div>
            <div id="channelList"><div style="padding: 40px; text-align: center; color: #666;"><div class="loading-spinner" style="margin: 0 auto 15px;"></div>Click "Load" to fetch channels</div></div>
        </div>

        <div class="main-content">
            <div class="player-section">
                <div class="video-container">
                    <div class="channel-badge" id="channelBadge">Select Channel</div>
                    <video id="videoPlayer" class="video-js vjs-default-skin" controls preload="auto">
                        <p class="vjs-no-js">Enable JavaScript to watch</p>
                    </video>
                </div>
                <div class="now-playing-bar">
                    <div class="now-playing-title" id="nowPlayingTitle">Ready to Stream</div>
                    <div class="now-playing-meta" id="nowPlayingMeta"><span>Click Load to see available channels</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                </div>
            </div>

            <div class="category-tabs" id="categoryTabs">
                <div class="tab active" data-category="all">All</div>
            </div>

            <div class="epg-section">
                <div class="epg-header">
                    <div class="epg-channel-col">Channel</div>
                    <div class="epg-time-header" id="timeHeader"></div>
                </div>
                <div class="epg-grid" id="epgGrid"></div>
            </div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
    <script>
        // REAL WORKING STREAMS - Free legal sources
        const WORKING_STREAMS = [
            { num: 1, name: "NASA TV", category: "Documentary", url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/NASA_logo.svg/200px-NASA_logo.svg.png", country: "USA" },
            { num: 2, name: "NASA TV Media", category: "Documentary", url: "https://ntv2.akamaized.net/hls/live/2013923/NASA-NTV2-HLS/master.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/NASA_logo.svg/200px-NASA_logo.svg.png", country: "USA" },
            { num: 3, name: "Red Bull TV", category: "Sports", url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/7/73/Red_Bull_TV_logo.svg/200px-Red_Bull_TV_logo.svg.png", country: "International" },
            { num: 4, name: "Cheddar News", category: "News", url: "https://live.chdrmedia.com/cbn/index.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/4/4f/Cheddar_logo.svg/200px-Cheddar_logo.svg.png", country: "USA" },
            { num: 5, name: "Bloomberg TV", category: "News", url: "https://liveproduseast.global.ssl.fastly.net/btv/desktop/us_live.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Bloomberg_Television_logo.svg/200px-Bloomberg_Television_logo.svg.png", country: "USA" },
            { num: 6, name: "CBS News", category: "News", url: "https://cbsn-us.cbsnstream.cbsnews.com/out/v1/55a8648e8f134e82a470f38d1d1f20b5/master.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/CBS_News_logo.svg/200px-CBS_News_logo.svg.png", country: "USA" },
            { num: 7, name: "ABC News Live", category: "News", url: "https://content.uplynk.com/channel/3324f2467c414329b3b0ccab144aeac1.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/ABC_News_Live_logo.svg/200px-ABC_News_Live_logo.svg.png", country: "USA" },
            { num: 8, name: "PBS America", category: "Documentary", url: "https://pbs-samsunguk.amagi.tv/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/3/33/PBS_logo.svg/200px-PBS_logo.svg.png", country: "USA" },
            { num: 9, name: "Weather Channel", category: "News", url: "https://weather-lh.akamaihd.net/i/twc_1@92006/master.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/6/66/The_Weather_Channel_logo.svg/200px-The_Weather_Channel_logo.svg.png", country: "USA" },
            { num: 10, name: "Tastemade", category: "Lifestyle", url: "https://tastemadeintaus-smooth.amagi.tv/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/4/4f/Tastemade_logo.svg/200px-Tastemade_logo.svg.png", country: "USA" },
            { num: 11, name: "FailArmy", category: "Entertainment", url: "https://failarmy-linear-smooth.amagi.tv/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/c/cf/FailArmy_logo.svg/200px-FailArmy_logo.svg.png", country: "USA" },
            { num: 12, name: "People TV", category: "Entertainment", url: "https://d1q2gjpe1untt4.cloudfront.net/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/People_magazine_logo.svg/200px-People_magazine_logo.svg.png", country: "USA" },
            { num: 13, name: "EuroNews English", category: "News", url: "https://euronews-euronews-world-1-au.samsung.wurl.com/manifest/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Euronews_2016_logo.svg/200px-Euronews_2016_logo.svg.png", country: "Europe" },
            { num: 14, name: "France 24 English", category: "News", url: "https://f24hls-i.akamaihd.net/hls/live/520811/f24hls/f24hls.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/5/53/France_24_logo.svg/200px-France_24_logo.svg.png", country: "France" },
            { num: 15, name: "DW English", category: "News", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Deutsche_Welle_symbol_2012.svg/200px-Deutsche_Welle_symbol_2012.svg.png", country: "Germany" },
            { num: 16, name: "TRT World", category: "News", url: "https://tv-trtworld.live.trt.com.tr/master.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/TRT_World_logo.svg/200px-TRT_World_logo.svg.png", country: "Turkey" },
            { num: 17, name: "Al Jazeera English", category: "News", url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/f/f2/Aljazeera_eng.svg/200px-Aljazeera_eng.svg.png", country: "Qatar" },
            { num: 18, name: "RT English", category: "News", url: "https://rt-glb.rttv.com/live/rtnews/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/RT_logo.svg/200px-RT_logo.svg.png", country: "Russia" },
            { num: 19, name: "CGTN English", category: "News", url: "https://news.cgtn.com/resource/live/english/cgtn-news.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/CGTN_logo.svg/200px-CGTN_logo.svg.png", country: "China" },
            { num: 20, name: "NHK World Japan", category: "News", url: "https://nhkwlive-ojp.akamaized.net/hls/live/2003459/nhkwlive-ojp-en/index.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/NHK_World-Japan_logo.svg/200px-NHK_World-Japan_logo.svg.png", country: "Japan" },
            { num: 21, name: "Arirang TV", category: "News", url: "https://amdlive-ch01-ctnd-cdn.streamcdn.akamaized.net/arirang_1ch/smil:arirang_1ch.smil/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/8/8f/Arirang_logo.svg/200px-Arirang_logo.svg.png", country: "Korea" },
            { num: 22, name: "Yahoo Finance", category: "Business", url: "https://yahoofinance-pc.amagi.tv/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Yahoo_Finance_logo_2021.png/200px-Yahoo_Finance_logo_2021.png", country: "USA" },
            { num: 23, name: "CNET TV", category: "Technology", url: "https://cnet-pc.amagi.tv/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/CNET_logo.svg/200px-CNET_logo.svg.png", country: "USA" },
            { num: 24, name: "Wired", category: "Technology", url: "https://wired-pc.amagi.tv/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Wired_logo.svg/200px-Wired_logo.svg.png", country: "USA" },
            { num: 25, name: "Adult Swim", category: "Animation", url: "https://adultswim-vodlive.cdn.turner.com/live/rick-and-morty/stream.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/AdultSwim.svg/200px-AdultSwim.svg.png", country: "USA" }
        ];

        let player;
        let channels = [];
        let currentChannel = null;
        let categories = new Set();

        document.addEventListener('DOMContentLoaded', () => {
            player = videojs('videoPlayer', {
                html5: { vhs: { overrideNative: true, limitRenditionByPlayerDimensions: true } },
                liveui: true
            });
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(updateProgress, 60000);
        });

        function loadChannels() {
            channels = WORKING_STREAMS;
            channels.forEach(c => {
                c.now = "Live Stream";
                categories.add(c.category);
            });
            
            document.getElementById('channelCount').textContent = `(${channels.length})`;
            renderCategoryTabs();
            renderChannelList();
            renderEPG();
            
            // Auto-play first channel
            if (channels.length > 0) selectChannel(channels[0].num);
        }

        function renderCategoryTabs() {
            const tabs = ['<div class="tab active" data-category="all" onclick="filterChannels(\'all\')">All</div>'];
            categories.forEach(cat => {
                tabs.push(`<div class="tab" data-category="${cat}" onclick="filterChannels('${cat}')">${cat}</div>`);
            });
            document.getElementById('categoryTabs').innerHTML = tabs.join('');
        }

        function renderChannelList(filter = 'all') {
            const list = document.getElementById('channelList');
            const filtered = filter === 'all' ? channels : channels.filter(c => c.category === filter);
            
            list.innerHTML = filtered.map(ch => `
                <div class="channel-item ${ch.num === currentChannel?.num ? 'active' : ''}" onclick="selectChannel(${ch.num})" id="channel-${ch.num}">
                    <div class="channel-number">${ch.num}</div>
                    <div class="channel-logo"><img src="${ch.logo}" alt="${ch.name}" onerror="this.style.display='none'; this.parentElement.innerText='${ch.name.substring(0,2)}'"></div>
                    <div class="channel-info">
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-now">${ch.country} • ${ch.category}</div>
                    </div>
                    <div class="channel-status online" title="Stream ready"></div>
                </div>
            `).join('');
        }

        function selectChannel(num) {
            const channel = channels.find(c => c.num === num);
            if (!channel) return;
            
            currentChannel = channel;
            document.getElementById('channelBadge').textContent = `CH ${channel.num} • ${channel.name}`;
            document.getElementById('nowPlayingTitle').textContent = channel.name;
            document.getElementById('nowPlayingMeta').innerHTML = `
                <span>📺 ${channel.category}</span>
                <span>🌍 ${channel.country}</span>
                <span>🔴 LIVE</span>
            `;
            
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`channel-${num}`)?.classList.add('active');
            
            // Load stream
            player.src({ src: channel.url, type: 'application/x-mpegURL' });
            player.play();
            
            renderEPG();
        }

        function filterChannels(category) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-category="${category}"]`)?.classList.add('active');
            renderChannelList(category);
        }

        function renderEPG() {
            const slots = [];
            const now = new Date();
            for (let i = 0; i < 6; i++) {
                const hour = (now.getHours() + i) % 24;
                const time = new Date(); time.setHours(hour, 0, 0);
                slots.push({ time: time.toLocaleTimeString('en-US', { hour: 'numeric', hour12: true }), current: i === 0 });
            }
            
            document.getElementById('timeHeader').innerHTML = slots.map(s => 
                `<div class="time-slot ${s.current ? 'current' : ''}">${s.time}</div>`
            ).join('');
            
            document.getElementById('epgGrid').innerHTML = channels.map(ch => `
                <div class="epg-row">
                    <div class="epg-channel-cell">
                        <span class="epg-channel-num">${ch.num}</span>
                        <span class="epg-channel-name">${ch.name}</span>
                    </div>
                    <div class="epg-programs">
                        ${slots.map((slot, idx) => `
                            <div class="program-block ${idx === 0 ? 'current' : ''}" onclick="selectChannel(${ch.num})">
                                <div class="program-title">${idx === 0 ? '🔴 LIVE' : 'Scheduled'}</div>
                                <div class="program-time">${slot.time}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        function updateProgress() {
            if (!currentChannel) return;
            const fill = document.getElementById('progressFill');
            fill.style.width = ((parseFloat(fill.style.width) || 0 + 2) % 100) + '%';
        }
    </script>
</body>
</html>
